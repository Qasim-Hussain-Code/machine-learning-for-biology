<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" class="figsvg">
  <!-- Figure 1.5: the four changes at gyrA position 86 against two drugs, as isolates resistant out of those carrying
       the change with a result for that drug. Filled cells: the change defeats the drug; outlined cell: it does not. -->
  <text x="438" y="24" font-size="22" text-anchor="middle" class="fm">Resistant, of those with a result</text>
  <text x="1" y="64" font-size="22" class="fm">Threonine 86 becomes</text>
  <g class="fi" font-size="24" text-anchor="middle">
    <text x="331" y="64">nalidixic acid</text>
    <text x="545" y="64">ciprofloxacin</text>
  </g>
  <line x1="0" y1="80" x2="640" y2="80" class="sl" stroke-width="1.5"/>

  <g class="fi" font-size="24">
    <text x="1" y="127">isoleucine</text>
    <text x="1" y="187">valine</text>
    <text x="1" y="247">lysine</text>
    <text x="1" y="307">alanine</text>
  </g>

  <g class="fa">
    <rect x="236" y="96" width="190" height="46" rx="8"/>
    <rect x="450" y="96" width="190" height="46" rx="8"/>
    <rect x="236" y="156" width="190" height="46" rx="8"/>
    <rect x="450" y="156" width="190" height="46" rx="8"/>
    <rect x="236" y="216" width="190" height="46" rx="8"/>
    <rect x="450" y="216" width="190" height="46" rx="8"/>
    <rect x="236" y="276" width="190" height="46" rx="8"/>
  </g>
  <rect x="451" y="277" width="188" height="44" rx="8" class="fn sb" stroke-width="2"/>

  <g class="fbg" font-size="24" text-anchor="middle">
    <text x="331" y="127"><tspan class="num">772</tspan> of <tspan class="num">775</tspan></text>
    <text x="545" y="127"><tspan class="num">808</tspan> of <tspan class="num">810</tspan></text>
    <text x="331" y="187"><tspan class="num">8</tspan> of <tspan class="num">8</tspan></text>
    <text x="545" y="187"><tspan class="num">8</tspan> of <tspan class="num">8</tspan></text>
    <text x="331" y="247"><tspan class="num">1</tspan> of <tspan class="num">1</tspan></text>
    <text x="545" y="247"><tspan class="num">1</tspan> of <tspan class="num">1</tspan></text>
    <text x="331" y="307"><tspan class="num">4</tspan> of <tspan class="num">4</tspan></text>
  </g>
  <text x="545" y="307" font-size="24" text-anchor="middle" class="fb"><tspan class="num">0</tspan> of <tspan class="num">4</tspan></text>
</svg>
