<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 494" class="figsvg">
  <!-- Figure 7.4: the six predictions, scored on the run told to make ten groups. Each row gives the prediction as
       written in advance and the number that decided it. -->
  <text x="0" y="24" font-size="24" class="fa">Four passed</text>
  <rect x="0" y="44" width="6" height="254" class="fa"/>
  <g font-size="22" class="fi">
    <text x="24" y="64">B cells come back largely intact<tspan x="24" dy="28" class="fm"><tspan class="fi num" font-size="24">99.9%</tspan> in one group, which was <tspan class="fi num" font-size="24">96%</tspan> B cells</tspan></text>
    <text x="24" y="130">Monocytes come back largely intact<tspan x="24" dy="28" class="fm"><tspan class="fi num" font-size="24">93%</tspan> in one group</tspan></text>
    <text x="24" y="196">The six T-cell labels do not separate cleanly<tspan x="24" dy="28" class="fm">None got a group with <tspan class="fi num" font-size="24">80%</tspan> of its cells at <tspan class="fi num" font-size="24">80%</tspan> purity</tspan></text>
    <text x="24" y="262">The helper tube does not separate from naive T cells<tspan x="24" dy="28" class="fm">Pair score <tspan class="fi num" font-size="24">0.05</tspan>, against <tspan class="fi num" font-size="24">0.49</tspan> for naive and memory</tspan></text>
  </g>

  <text x="0" y="350" font-size="24" class="fb">Two failed</text>
  <rect x="0" y="370" width="6" height="122" class="fb"/>
  <g font-size="22" class="fi">
    <text x="24" y="390">NK cells partly blur into cytotoxic T cells<tspan x="24" dy="28" class="fm">Overlap <tspan class="fi num" font-size="24">0.05</tspan>, needed at least <tspan class="fi num" font-size="24">0.10</tspan></tspan></text>
    <text x="24" y="456">The CD34+ tube mostly holds together<tspan x="24" dy="28" class="fm">Its biggest group held <tspan class="fi num" font-size="24">30%</tspan> of it, needed <tspan class="fi num" font-size="24">80%</tspan></tspan></text>
  </g>
</svg>
