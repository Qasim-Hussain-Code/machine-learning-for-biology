<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" class="figsvg">
  <rect x="70" y="4" width="500" height="58" rx="8" class="fp"/>
  <text x="320" y="42" font-size="24" text-anchor="middle" class="fi">Leucine or methionine at position two</text>

  <g class="sm" stroke-width="2">
    <line x1="320" y1="62" x2="320" y2="84"/>
    <line x1="160" y1="84" x2="480" y2="84"/>
