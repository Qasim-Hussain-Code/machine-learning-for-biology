<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" class="figsvg">
  <g class="fp">
    <rect x="0" y="4" width="64" height="48" rx="6"/>
    <rect x="144" y="4" width="64" height="48" rx="6"/>
    <rect x="216" y="4" width="64" height="48" rx="6"/>
    <rect x="360" y="4" width="64" height="48" rx="6"/>
    <rect x="432" y="4" width="64" height="48" rx="6"/>
    <rect x="504" y="4" width="64" height="48" rx="6"/>
  </g>
  <g class="fa2">
    <rect x="72" y="4" width="64" height="48" rx="6"/>
    <rect x="576" y="4" width="64" height="48" rx="6"/>
  </g>
  <rect x="288" y="4" width="64" height="48" rx="6" class="fa"/>
  <g class="fi" font-size="28" text-anchor="middle">
    <text x="32" y="39">G</text>
    <text x="176" y="39">L</text>
    <text x="248" y="39">G</text>
    <text x="392" y="39">V</text>
    <text x="464" y="39">F</text>
    <text x="536" y="39">T</text>
  </g>
  <g class="fbg" font-size="28" text-anchor="middle">
    <text x="104" y="39">I</text>
    <text x="320" y="39">F</text>
    <text x="608" y="39">L</text>
  </g>
  <g font-size="22">
    <text x="104" y="80" text-anchor="middle" class="fa2">position two</text>
    <text x="320" y="80" text-anchor="middle" class="fa">change one letter here</text>
    <text x="638" y="80" text-anchor="end" class="fa2">position nine</text>
  </g>

  <g class="fp">
    <rect x="0" y="104" width="310" height="182" rx="8"/>
    <rect x="330" y="104" width="310" height="182" rx="8"/>
  </g>
  <g font-size="24" class="fi" text-anchor="middle">
    <text x="155" y="142">Ask the groove</text>
    <text x="485" y="142">Ask a T cell</text>
  </g>
  <g font-size="22" class="fm" text-anchor="middle">
    <text x="155" y="180">Positions two and nine</text>
    <text x="155" y="210">are unchanged, and the</text>
    <text x="155" y="240">grip barely notices.</text>
    <text x="485" y="180">Position five points out</text>
    <text x="485" y="210">of the groove, straight</text>
    <text x="485" y="240">at the T-cell receptor.</text>
  </g>
  <g font-size="22" class="fi" text-anchor="middle">
    <text x="155" y="270">The answer may be yes.</text>
    <text x="485" y="270">The answer may be no.</text>
  </g>

  <text x="320" y="326" font-size="23" text-anchor="middle" class="fi">Two different answers, depending on who is asking.</text>
</svg>
