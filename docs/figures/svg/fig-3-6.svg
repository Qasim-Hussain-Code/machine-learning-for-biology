<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" class="figsvg">
  <!-- Figure 3.6: the same random forest given fewer columns, on a 0 to 0.4 MCC axis (1,300 units per unit of MCC).
       Accent bars are scored on the five held-out genomes; the second-accent bar is the DNA-only forest in
       cross-validation on the twenty training genomes. -->
  <rect x="0" y="6" width="28" height="22" class="fa"/>
  <rect x="0" y="42" width="28" height="22" class="fa2"/>
  <g font-size="22" class="fm">
    <text x="40" y="25">MCC on the five held-out genomes</text>
    <text x="40" y="61">MCC in cross-validation on the twenty training genomes</text>
  </g>

  <g font-size="22" class="fi">
    <text x="1" y="118">All <tspan class="num">61</tspan> features</text>
    <text x="0" y="198">Gene-caller features taken away: <tspan class="num">26</tspan> left</text>
    <text x="0" y="278">Database features taken away too: <tspan class="num">17</tspan> left, all raw DNA</text>
  </g>
  <g class="fa">
    <rect x="0" y="130" width="393.9" height="26"/>
    <rect x="0" y="210" width="336.7" height="26"/>
    <rect x="0" y="290" width="184.6" height="26"/>
  </g>
  <rect x="0" y="322" width="91" height="26" class="fa2"/>
  <g font-size="24" class="fi">
    <text x="402.9" y="151" class="num">0.303</text>
    <text x="345.7" y="231" class="num">0.259</text>
    <text x="193.6" y="311" class="num">0.142</text>
    <text x="100" y="343" class="num">0.070</text>
  </g>

  <g class="sm" stroke-width="1.2">
    <line x1="0" y1="370" x2="520" y2="370"/>
    <line x1="0" y1="370" x2="0" y2="379"/><line x1="130" y1="370" x2="130" y2="379"/>
    <line x1="260" y1="370" x2="260" y2="379"/><line x1="390" y1="370" x2="390" y2="379"/>
    <line x1="520" y1="370" x2="520" y2="379"/>
  </g>
  <g class="fm" font-size="22" text-anchor="middle">
    <text x="7" y="406" class="num">0</text><text x="130" y="406" class="num">0.1</text>
    <text x="260" y="406" class="num">0.2</text><text x="390" y="406" class="num">0.3</text>
    <text x="520" y="406" class="num">0.4</text>
  </g>
</svg>
