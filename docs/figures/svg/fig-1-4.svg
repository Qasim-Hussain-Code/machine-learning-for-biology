<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" class="figsvg">
  <!-- Figure 1.4: which gyrA position 86 columns survive a rarity threshold of ten and of five, and what the rule scores. -->
  <text x="348" y="24" font-size="22" text-anchor="middle" class="fm">Change at <tspan font-style="italic">gyrA</tspan> position 86</text>
  <g font-size="22" text-anchor="middle" class="fi">
    <text x="268" y="62"><tspan class="num" font-size="24">810</tspan> isolates</text>
    <text x="428" y="62"><tspan class="num" font-size="24">8</tspan> isolates</text>
  </g>
  <text x="640" y="62" font-size="22" text-anchor="end" class="fi">Rule scores</text>
  <line x1="0" y1="78" x2="640" y2="78" class="sl" stroke-width="1.5"/>

  <g font-size="24" class="fi">
    <text x="0" y="126">Threshold <tspan class="num">10</tspan></text>
    <text x="0" y="198">Threshold <tspan class="num">5</tspan></text>
  </g>

  <g class="fa">
    <rect x="196" y="94" width="144" height="48" rx="8"/>
    <rect x="196" y="166" width="144" height="48" rx="8"/>
    <rect x="356" y="166" width="144" height="48" rx="8"/>
  </g>
  <rect x="357" y="95" width="142" height="46" rx="8" class="fn sb" stroke-width="2" stroke-dasharray="7 5"/>
  <g font-size="24" text-anchor="middle" class="fbg">
    <text x="268" y="126">isoleucine</text>
    <text x="268" y="198">isoleucine</text>
    <text x="428" y="198">valine</text>
  </g>
  <text x="428" y="126" font-size="24" text-anchor="middle" class="fb">valine</text>
  <line x1="394" y1="119" x2="462" y2="119" class="sb" stroke-width="2"/>

  <g font-size="26" text-anchor="end" class="fi">
    <text x="640" y="127" class="num">99.55%</text>
    <text x="640" y="199" class="num">99.75%</text>
  </g>
</svg>
