<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" class="figsvg">
  <!-- Figure 3.5: MCC of three baselines (muted) and three models (accent), all scored on the same held-out regions,
       on a 0 to 0.4 axis (1,300 units per unit of MCC). The model that always says yes has no bar: it scores 0.000. -->
  <g font-size="22" class="fi">
    <text x="0" y="24">The model that always says yes</text>
    <text x="0" y="98">Protein length only</text>
    <text x="0" y="172">Prokka's UniProtKB match only</text>
    <text x="0" y="246">One decision tree</text>
    <text x="0" y="320">Random forest</text>
    <text x="0" y="394">Gradient boosting</text>
  </g>
  <g class="fm">
    <rect x="0" y="36" width="2" height="26"/>
    <rect x="0" y="110" width="36.4" height="26"/>
    <rect x="0" y="184" width="183.3" height="26"/>
  </g>
  <g class="fa">
    <rect x="0" y="258" width="339.3" height="26"/>
    <rect x="0" y="332" width="393.9" height="26"/>
    <rect x="0" y="406" width="374.4" height="26"/>
  </g>
  <g font-size="24" class="fi">
    <text x="10" y="57" class="num">0.000</text>
    <text x="45.4" y="131" class="num">0.028</text>
    <text x="192.3" y="205" class="num">0.141</text>
    <text x="348.3" y="279" class="num">0.261</text>
    <text x="402.9" y="353" class="num">0.303</text>
    <text x="383.4" y="427" class="num">0.288</text>
  </g>
  <text x="104" y="57" font-size="22" class="fm">but <tspan class="num fi">0.664</tspan> with F1, the highest F1 of all</text>

  <g class="sm" stroke-width="1.2">
    <line x1="0" y1="450" x2="520" y2="450"/>
    <line x1="0" y1="450" x2="0" y2="459"/><line x1="130" y1="450" x2="130" y2="459"/><line x1="260" y1="450" x2="260" y2="459"/>
    <line x1="390" y1="450" x2="390" y2="459"/><line x1="520" y1="450" x2="520" y2="459"/>
  </g>
  <g class="fm" font-size="22" text-anchor="middle">
    <text x="7" y="486" class="num">0</text><text x="130" y="486" class="num">0.1</text>
    <text x="260" y="486" class="num">0.2</text><text x="390" y="486" class="num">0.3</text>
    <text x="520" y="486" class="num">0.4</text>
  </g>
  <text x="0" y="520" font-size="22" class="fm">MCC, every model scored on the same held-out regions</text>
</svg>
