<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" class="figsvg">
  <!-- Figure 3.3: how the ribosomal RNA search failed without an error. Each program calls the one below it; what came
       back up was nothing, and the program at the top reported zero and exited with code 0. -->
  <g class="fp sl" stroke-width="1.5">
    <rect x="1" y="4" width="238" height="64" rx="8"/>
    <rect x="1" y="148" width="238" height="64" rx="8"/>
  </g>
  <rect x="1" y="292" width="238" height="64" rx="8" class="fp sb" stroke-width="2"/>
  <g font-size="26" class="fi" text-anchor="middle">
    <text x="120" y="45">Prokka</text>
    <text x="120" y="189">barrnap</text>
    <text x="120" y="333">nhmmer</text>
  </g>

  <g class="sm" stroke-width="2">
    <line x1="72" y1="68" x2="72" y2="134"/>
    <line x1="72" y1="212" x2="72" y2="278"/>
  </g>
  <g class="sm" stroke-width="2" stroke-dasharray="5 4">
    <line x1="168" y1="148" x2="168" y2="82"/>
    <line x1="168" y1="292" x2="168" y2="226"/>
  </g>
  <g class="fm">
    <polygon points="65,134 72,148 79,134"/>
    <polygon points="65,278 72,292 79,278"/>
    <polygon points="161,82 168,68 175,82"/>
    <polygon points="161,226 168,212 175,226"/>
  </g>
  <g font-size="22" class="fm">
    <text x="84" y="116">calls</text>
    <text x="84" y="260">calls</text>
    <text x="180" y="116">nothing</text>
    <text x="180" y="260">nothing</text>
  </g>

  <g font-size="24" class="fi">
    <text x="272" y="28">Prints <tspan class="num" font-size="22">Found 0 rRNAs</tspan></text>
    <text x="272" y="62">and exits with code <tspan class="num">0</tspan></text>
  </g>
  <text x="272" y="314" font-size="24" class="fb">Fails at runtime, every time</text>
  <g font-size="22" class="fm">
    <text x="272" y="342">compiled against one version of a</text>
    <text x="272" y="368">maths library; another was shipped</text>
  </g>
</svg>
